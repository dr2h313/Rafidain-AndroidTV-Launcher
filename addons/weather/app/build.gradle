plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.sumyabazar1.weather'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.sumyabazar1.weather'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // Sideloaded over ADB like the launcher: signed with the debug key. Sign your own releases with your key.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def vName = variant.versionName
            def bType = variant.buildType.name
            outputFileName = "CleanYourTV_Weather_Basra_v${vName}_${bType}.apk"
        }
    }
}

dependencies {
    // Test only (never in the APK): plain JVM tests for the code and AQI tables, src/test.
    testImplementation 'junit:junit:4.13.2'
}
